        justify-content: center;
        background: linear-gradient(rgb(15 8 5), rgb(19 10 7) 48%, rgb(15 8 5));
        direction: ltr;

        position: relative;
        width: 240px;

        width: 100%;
        height: auto;
      }

      @media screen and (min-width: 1280px) {
        .preloader__container {
          width: 400px;
          height: 142px;
        }
      }
