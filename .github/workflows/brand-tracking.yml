name: Verify brand tracking links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/brands.js'
      - 'scripts/main.js'
      - 'scripts/pages/brand-layout.js'
      - 'scripts/pages/brand.js'
      - '**/brands/**/index.html'
      - '**/casinos-and-betting/index.html'
      - 'tools/build-pinco-reviews.mjs'
      - 'tools/pinco-review-copy.mjs'
      - 'tools/test-brand-affiliate-links.mjs'
      - '.github/workflows/brand-tracking.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '**/brands/**/index.html'
      - '**/casinos-and-betting/index.html'
      - 'tools/build-pinco-reviews.mjs'
      - 'tools/pinco-review-copy.mjs'
      - 'tools/test-brand-affiliate-links.mjs'
      - '.github/workflows/brand-tracking.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-tracking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check review and catalog tracking links
        run: node --test tools/test-brand-affiliate-links.mjs
