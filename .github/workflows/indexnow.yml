name: Submit URLs to IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel deployment
        run: sleep 90

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_HOST: spincresta.com
          INDEXNOW_KEY_LOCATION: https://spincresta.com/4f6c73cc63b84633ad627127be893da7.txt
          INDEXNOW_BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}
        run: node scripts/submit-indexnow.mjs
